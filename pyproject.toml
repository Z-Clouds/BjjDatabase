[tool.poetry]
name = "bjj-database"
version = "0.1.0"
description = "A BJJ match data scraping, storage, and visualization project."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.3"
selenium = "^4.17.2"
pandas = "^2.1.3"
numpy = "^1.26.0"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
sqlalchemy = "^2.0.23"
psycopg2 = "^2.9.9"
dash = "^2.14.2"
webdriver-manager = "^4.0.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
